name: Notify when Windows build finishes

on:
  workflow_run:
    workflows:
      - Build Bambu Studio AI for Windows
    types:
      - completed

permissions:
  contents: read
  issues: write

jobs:
  notify:
    if: ${{ github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send GitHub notification
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const conclusion = run.conclusion || 'unknown';
            const successful = conclusion === 'success';
            const icon = successful ? '✅' : '❌';
            const result = successful ? 'הבנייה הסתיימה בהצלחה' : `הבנייה הסתיימה עם תוצאה: ${conclusion}`;
            const title = '🔔 Bambu Studio AI — Build notifications';
            const body = [
              `${icon} **${result}**`,
              '',
              `Run: [#${run.run_number} — ${run.name}](${run.html_url})`,
              `Branch: \`${run.head_branch}\``,
              `Commit: \`${run.head_sha.substring(0, 7)}\``,
              '',
              `@${context.repo.owner}`
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            const existing = issues.find(issue => !issue.pull_request && issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                assignees: [context.repo.owner]
              });
            }
